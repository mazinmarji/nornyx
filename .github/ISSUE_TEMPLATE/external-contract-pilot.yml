name: External contract pilot
description: Report running Nornyx governance against a contract you authored
title: "[adoption] own-contract pilot — "
labels: ["external-adoption", "own-contract"]
body:
  - type: markdown
    attributes:
      value: |
        This is the strongest signal this project can receive: governance
        reaching a decision on a contract someone else wrote, rather than the
        one shipped as package data.

        **Do not paste your contract if it is proprietary.** Describe it
        structurally instead — `capability.<redacted-write-capability>` is a
        perfectly usable report. Never include secrets, credentials, tokens,
        API keys, private prompts, or internal policy text.

  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: >-
            I have removed secrets, credentials, proprietary contract text, and
            anything internal. Names may be described structurally.
          required: true

  - type: dropdown
    id: contract-source
    attributes:
      label: Contract source
      options:
        - "I authored it from scratch"
        - "I adapted the bundled conformance fixture"
        - "I adapted an example from the repository"
        - "It was generated by a tool"
        - "Other — described below"
    validations:
      required: true

  - type: input
    id: subject-revision
    attributes:
      label: Contract subject revision
      description: >-
        The `subject_revision` your Authorizer reported. It identifies the
        contract without disclosing its content.
      placeholder: "e.g. git:0123456789abcdef..."
    validations:
      required: true

  - type: textarea
    id: allowed
    attributes:
      label: What capability was allowed?
      description: >-
        Which identity held which capability, and what the governed action did.
        Structural names are fine.
      placeholder: "identity.<redacted-service> held capability.<redacted-read>; the tool returned a record."
    validations:
      required: true

  - type: textarea
    id: denied
    attributes:
      label: What capability was denied?
      description: >-
        Which identity lacked which capability, and — the part that matters —
        whether the action ran anyway.
      placeholder: "identity.<redacted-agent> lacked capability.<redacted-write>; the action ran 0 times."
    validations:
      required: true

  - type: dropdown
    id: decision-occurred
    attributes:
      label: Did a governed decision actually occur?
      description: >-
        An authorization must have been evaluated. If the action simply did not
        run for another reason, that is not a governed decision.
      options:
        - "Yes — an authorization was evaluated and a decision returned"
        - "No — nothing evaluated an authorization"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Was evidence emitted?
      options:
        - "Yes — decision events were recorded"
        - "Yes — decision and observation events were recorded"
        - "No evidence was recorded"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: manually-reviewed
    attributes:
      label: What did you review by hand?
      description: >-
        Which parts did you actually inspect and satisfy yourself about — the
        events, the decision codes, the lock, the composed governance?
    validations:
      required: true

  - type: textarea
    id: not-tested
    attributes:
      label: What did you NOT test?
      description: >-
        Required, and the most valuable field here. An honest boundary makes the
        report usable as evidence; an unbounded claim does not. Async paths,
        other frameworks, bypass routes, multi-agent handoff, approval flows —
        whatever you did not exercise.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.12.7
        nornyx-agentic-adapters: 0.3.0
        nornyx: 1.11.0
        Framework and version, if any: crewai 1.15.4
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: What was hard?
      description: >-
        Optional. Where the contract language, the adapter API, or the docs made
        this harder than it needed to be.
