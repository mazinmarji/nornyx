name: AuthZEN maintenance candidate

on:
  push:
    branches:
      - candidate/authzen-v1.11-isolated

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact candidate with audit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and inspect wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m twine check dist/* || true
          python -m build
          python -m twine check dist/*
      - name: Prove AuthZEN module is packaged
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/nornyx-*.whl")
          if len(wheel) != 1:
              raise SystemExit(f"expected exactly one core wheel, got {wheel}")
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          required = "nornyx/agentic/authzen.py"
          if required not in names:
              raise SystemExit(f"{required} missing from candidate wheel")
          print(f"packaged: {required}")
          PY
