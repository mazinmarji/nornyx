name: adapters-release

# Publishes nornyx-agentic-adapters to PyPI via Trusted Publishing (OIDC) — no
# API token stored anywhere. This is a SEPARATE release cadence from the core
# nornyx package's own release.yml. Publishing requires a positive binding
# check: the release tag must match `adapters-vX.Y.Z` exactly, and that X.Y.Z
# must equal the adapter package's own pyproject.toml version at the exact
# commit the tag targets — a tag/version mismatch (e.g. tagging
# adapters-v0.2.1 while the package still declares 0.2.0) fails closed rather
# than publishing. A release marked as a prerelease publishes nothing, and
# neither does a tag on a commit that main does not contain. Manual dispatch
# runs the test job without deploying to PyPI and cannot satisfy the binding
# check (there is no release tag to evaluate). This workflow never creates,
# moves, or repairs tags.
#
# Requires its own one-time PyPI trusted-publisher registration for the
# `nornyx-agentic-adapters` project (repo mazinmarji/nornyx, workflow
# adapters-release.yml, environment pypi-adapters) — a separate, owner
# performed operational prerequisite. Until that registration exists, the
# `publish` job's OIDC exchange will simply fail; nothing here can publish
# on its own.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the core nornyx wheel from this candidate
        run: |
          python -m pip install build
          python -m build
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
      - name: Install and test the adapter package
        working-directory: adapters/nornyx-agentic-adapters
        run: |
          python -m pip install -e ".[dev,crewai,langgraph]"
          python -m pytest -q
          python -m build
          adapter_wheel="$(find dist -maxdepth 1 -type f -name 'nornyx_agentic_adapters-*.whl' -print -quit)"
          core_wheel="$(find ../../dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$adapter_wheel"
          test -n "$core_wheel"
          python scripts/test_wheel_install.py "$adapter_wheel" --core-wheel "$core_wheel" --with-langgraph

  check-adapter-tag:
    # Only a 'release' event has a tag_name to evaluate; workflow_dispatch has
    # none, so it is correctly excluded from ever setting eligible=true.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Checkout the exact commit the release tag targets
        uses: actions/checkout@v4
        with:
          # Full history fetches every branch to refs/remotes/origin/*, so the
          # check below can confirm main contains the tagged commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches adapters-vX.Y.Z, binds to the package version, is not a prerelease and is on main
        id: check
        # The tag name and the prerelease flag reach the script as data, never
        # as script text: git allows quotes, `$`, `;` and `(` in tag names.
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="$TAG_NAME"
          eligible=false
          if [[ "$tag" =~ ^adapters-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
            pkg_version="$(grep -m1 -E '^version[[:space:]]*=' adapters/nornyx-agentic-adapters/pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')"
            pkg_version="${pkg_version%$'\r'}"
            if [[ "$tag_version" != "$pkg_version" ]]; then
              echo "::error::release tag adapters-v${tag_version} does not match adapter package version ${pkg_version} at this commit"
            elif [[ "$PRERELEASE" != "false" ]]; then
              # An adapters-vX.Y.Z upload is a final release on PyPI and cannot
              # be replaced, so a GitHub prerelease never publishes.
              echo "::error::release ${tag} is marked as a prerelease; prereleases never publish"
            elif ! main_sha="$(git show-ref --verify --hash refs/remotes/origin/main)" || ! git merge-base --is-ancestor HEAD "$main_sha"; then
              # main is resolved by its full ref name only, so no tag or branch
              # named like it can stand in for it; a missing main refuses.
              echo "::error::release tag ${tag} targets a commit that main does not contain"
            else
              eligible=true
            fi
          fi
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'release' && needs.check-adapter-tag.outputs.eligible == 'true'
    needs: [test, check-adapter-tag]
    runs-on: ubuntu-latest
    environment: pypi-adapters
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build adapter distributions
        working-directory: adapters/nornyx-agentic-adapters
        run: |
          python -m pip install build
          python -m build
      # Bind what is uploaded, not only what pyproject.toml declares: exactly
      # the sdist and wheel for the tag's version, nothing else.
      - name: Verify the built distributions carry the release tag's version
        working-directory: adapters/nornyx-agentic-adapters
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#adapters-v}"
          test -f "dist/nornyx_agentic_adapters-${version}.tar.gz"
          test -f "dist/nornyx_agentic_adapters-${version}-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed: PyPI verifies the OIDC identity of this workflow.
        with:
          packages-dir: adapters/nornyx-agentic-adapters/dist
          # PEP 740 attestations, declared rather than inherited, as in
          # release.yml: the action ref tracks a moving branch, so provenance
          # must be a property of this workflow, not of the action's default.
          # tests/test_identity_claims_boundary.py asserts it stays.
          attestations: true
