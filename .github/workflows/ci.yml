name: CI

# Automated checks for pull requests and main. This is intentionally separate
# from `nornyx-safe-dev-quality.yml`, which is a maintainer-run, manual-only
# (`workflow_dispatch`) quality pass and must stay that way.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prove the advertised requires-python >=3.10 range, not just one version.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install package
        run: python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Check candidate diff hygiene
        # Whitespace hygiene against the live PR base — no hardcoded historical SHA.
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Run installed-wheel no-network smoke
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/test_wheel_install.py "$wheel"
      - name: Check a bundled example contract
        run: python -m nornyx.cli check examples/governed_delivery_control_plane.nyx

  adapter-foundation:
    # ADR-0039 M2-A: nornyx-agentic-adapters is a separate distribution built
    # from adapters/nornyx-agentic-adapters/, depending on the core nornyx
    # wheel built from this SAME candidate commit (never from PyPI), so a
    # future PR touching both packages together is tested against each other.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Build and install the core nornyx wheel from this candidate
        run: |
          python -m pip install build
          python -m build
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
      - name: Install the adapter package
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m ruff check .
      - name: Run adapter package tests
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m pytest -q
      - name: Check candidate diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Build adapter distributions
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m build
      - name: Check adapter distributions
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m twine check dist/*
      - name: Run installed-wheel no-network smoke
        working-directory: adapters/nornyx-agentic-adapters
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx_agentic_adapters-*.whl' -print -quit)"
          core_wheel="$(find ../../dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          test -n "$core_wheel"
          python scripts/test_wheel_install.py "$wheel" --core-wheel "$core_wheel"

  adapter-crewai-native:
    # ADR-0039 M2-B: exercises adapters/nornyx-agentic-adapters' CrewAI
    # submodule against the real, pinned crewai==1.15.4 (not a mock), same
    # single-version convention as the root package's own native-frameworks
    # job. Builds the core nornyx wheel from this candidate first, exactly
    # like adapter-foundation, so the adapter is tested against itself, never
    # against a previously published PyPI core release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install the core nornyx wheel from this candidate
        run: |
          python -m pip install build
          python -m build
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
      - name: Install the adapter package with the CrewAI extra
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m pip install -e ".[crewai,dev]"
      - name: Record the CrewAI version and forbid silent skips
        run: python -c "import crewai; print('crewai', crewai.__version__); assert crewai.__version__ == '1.15.4', crewai.__version__"
      - name: Native CrewAI adapter tests (no skips permitted)
        working-directory: adapters/nornyx-agentic-adapters
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          python -m pytest tests/test_crewai_adapter.py tests/test_crewai_adapter_missing_dependency.py \
            -v -rs --junitxml=crewai-native-results.xml
          # Fail closed if ANY focused CrewAI test skipped (e.g. crewai silently
          # absent): deterministic skip check, not a printed version string.
          python -c "import xml.etree.ElementTree as ET, sys; suites = ET.parse('crewai-native-results.xml').getroot().findall('.//testsuite'); skipped = sum(int(s.get('skipped', 0)) for s in suites); tests = sum(int(s.get('tests', 0)) for s in suites); print('crewai-native tests', tests, 'skipped', skipped); sys.exit(1 if (skipped or not tests) else 0)"
      - name: Build the candidate adapter wheel
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m build --wheel
      - name: Installed-wheel CrewAI smoke in a fresh env, outside all source roots
        shell: bash
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          set -euo pipefail
          core_wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          adapter_wheel="$(find adapters/nornyx-agentic-adapters/dist -maxdepth 1 -type f -name 'nornyx_agentic_adapters-*.whl' -print -quit)"
          test -n "$core_wheel"
          test -n "$adapter_wheel"
          venv="$RUNNER_TEMP/wheel-crewai-venv"
          python -m venv "$venv"
          # Install the candidate core wheel + the built adapter wheel WITH the
          # CrewAI extra into a fresh env; editable-source success is insufficient.
          "$venv/bin/python" -m pip install --disable-pip-version-check "$core_wheel" "${adapter_wheel}[crewai]"
          "$venv/bin/python" -c "import crewai; assert crewai.__version__ == '1.15.4', crewai.__version__; print('wheel-env crewai', crewai.__version__)"
          # Import and smoke the installed wheel from OUTSIDE all repo/source roots.
          cd "$RUNNER_TEMP"
          "$venv/bin/python" - <<'PY'
          import socket
          import sys

          def _blocked(*_a, **_k):
              raise AssertionError("network access attempted during wheel crewai smoke")

          socket.socket.connect = _blocked
          socket.create_connection = _blocked

          from nornyx.agentic import Decision, DecisionCode, DecisionEffect, EvaluationContext
          from nornyx_agentic_adapters import AdapterDenied, SurfaceBinding
          from nornyx_agentic_adapters.crewai_adapter import COVERAGE_INVENTORY, make_governed_tool

          REV = "git:0123456789abcdef0123456789abcdef01234567"
          CTX = EvaluationContext(decision_at="2026-07-23T00:00:00Z", observed_subject_revision=REV)

          class _Rec:
              def record_decision(self, decision, *, mission_id):
                  pass
              def record_observation(self, *_a, **_k):
                  pass

          class _Allow:
              def evaluate(self, request, *, context):
                  return Decision(DecisionEffect.ALLOW, DecisionCode.ALLOWED, "")

          class _Deny:
              def evaluate(self, request, *, context):
                  return Decision(DecisionEffect.DENY, DecisionCode.CAPABILITY_DENIED, "denied")

          BINDING = SurfaceBinding("tool:x", "identity:agent-1", "capability:read")

          ran = []
          allow_tool = make_governed_tool(
              name="allow_reader", description="d", binding=BINDING, authorizer=_Allow(),
              context=CTX, recorder=_Rec(), mission_id="m", action=lambda: (ran.append(1) or "ok"),
          )
          assert allow_tool.run() == "ok"
          assert ran == [1], "allowed governed tool must run its action exactly once"

          side = []
          deny_tool = make_governed_tool(
              name="deny_reader", description="d", binding=BINDING, authorizer=_Deny(),
              context=CTX, recorder=_Rec(), mission_id="m", action=lambda: side.append(1),
          )
          try:
              deny_tool.run()
              raise SystemExit("DENY did not block the governed tool")
          except AdapterDenied:
              pass
          assert side == [], "denied governed tool must execute zero side effects"

          surfaces = {e.surface: e.status.value for e in COVERAGE_INVENTORY.entries}
          assert surfaces["tool_invocation"] == "wrapped"
          assert surfaces["async_tool_invocation"] == "unsupported"

          print("WHEEL_CREWAI_SMOKE_OK crewai_in_sys_modules=%s" % ("crewai" in sys.modules))
          PY

  adapter-langgraph-native:
    # ADR-0039 M2-C / ADR-0042: exercise the supported adapter against the
    # exact public LangGraph 1.2.2 runtime metadata and a candidate core wheel.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install candidate core
        run: |
          python -m pip install build
          python -m build
          core_wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$core_wheel"
          python -m pip install "$core_wheel"
      - name: Install adapter with exact LangGraph extra
        working-directory: adapters/nornyx-agentic-adapters
        run: python -m pip install -e ".[langgraph,dev]"
      - name: Native LangGraph adapter tests (no skips permitted)
        working-directory: adapters/nornyx-agentic-adapters
        run: |
          python -c "import importlib.metadata as m; assert m.version('langgraph') == '1.2.2'"
          python -m pytest tests/test_langgraph_adapter.py tests/test_langgraph_adapter_missing_dependency.py \
            -v -rs --junitxml=langgraph-native-results.xml
          python -c "import xml.etree.ElementTree as ET, sys; suites = ET.parse('langgraph-native-results.xml').getroot().findall('.//testsuite'); skipped = sum(int(s.get('skipped', 0)) for s in suites); tests = sum(int(s.get('tests', 0)) for s in suites); print('langgraph-native tests', tests, 'skipped', skipped); sys.exit(1 if (skipped or not tests) else 0)"
      - name: Build and smoke the installed adapter wheel
        working-directory: adapters/nornyx-agentic-adapters
        shell: bash
        run: |
          python -m build --wheel
          adapter_wheel="$(find dist -maxdepth 1 -type f -name 'nornyx_agentic_adapters-*.whl' -print -quit)"
          core_wheel="$(find ../../dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$adapter_wheel"
          test -n "$core_wheel"
          python scripts/test_wheel_install.py "$adapter_wheel" --core-wheel "$core_wheel" --with-langgraph

  crewai-governance-benchmark:
    # examples/crewai_governance_benchmark is an external-facing A/B benchmark
    # whose tests skip when crewai or the nornyx-agentic-adapters distribution is
    # absent — which is exactly the case in the default `test` matrix. Without
    # this job the benchmark suite would silently contribute zero assertions to
    # CI. This job installs the candidate core wheel and the candidate adapter
    # with the CrewAI extra, runs the benchmark offline, and fails closed if the
    # benchmark exits non-zero, if no benchmark test runs, or if any of them skip.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install the core nornyx wheel from this candidate
        run: |
          python -m pip install build
          python -m build
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
      - name: Install pytest and the candidate adapter with the CrewAI extra
        run: |
          python -m pip install pytest
          python -m pip install -e "./adapters/nornyx-agentic-adapters[crewai]"
      - name: Verify the exact toolchain the benchmark claims
        run: |
          python -c "import crewai; assert crewai.__version__ == '1.15.4', crewai.__version__; print('crewai', crewai.__version__)"
          python -c "import importlib.metadata as m; print('nornyx', m.version('nornyx')); print('adapters', m.version('nornyx-agentic-adapters'))"
      - name: Run the benchmark offline
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          python examples/crewai_governance_benchmark/benchmark.py \
            --out "$RUNNER_TEMP/crewai-governance-benchmark"
      - name: Assert the run's own output contract
        run: |
          python - "$RUNNER_TEMP/crewai-governance-benchmark" <<'PY'
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          payload = json.loads((out / "benchmark.json").read_text(encoding="utf-8"))
          report = json.loads((out / "nornyx_evidence_report.json").read_text(encoding="utf-8"))

          failed = [c for c in payload["contract_checks"] if not c["passed"]]
          evidence = payload["metrics"]["evidence"]
          problems = []
          if failed:
              problems += [f"contract check failed: {c['check']}: {c['detail']}" for c in failed]
          if payload["verdict"]["verdict"] != "GO":
              problems.append(f"verdict is {payload['verdict']['verdict']}, not GO")
          if evidence["validation_status"] != "pass":
              problems.append(f"full-stream validation is {evidence['validation_status']!r}")
          if evidence["diagnostics"] or report["diagnostics"]:
              problems.append(f"evidence diagnostics: {report['diagnostics']}")
          if report["status"] != "pass":
              problems.append(f"evidence report status is {report['status']!r}")

          print(json.dumps({
              "verdict": payload["verdict"]["verdict"],
              "contract_checks": len(payload["contract_checks"]),
              "failed_checks": len(failed),
              "evidence_status": evidence["validation_status"],
              "evidence_diagnostics": len(report["diagnostics"]),
              "candidate_digest": payload["candidate_digest"],
          }, indent=2))
          for problem in problems:
              print("PROBLEM:", problem)
          sys.exit(1 if problems else 0)
          PY
      - name: Benchmark tests with no skips permitted
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          python -m pytest tests/test_crewai_governance_benchmark.py \
            -v -rs --junitxml=benchmark-results.xml

          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("benchmark-results.xml").getroot()
          suites = root.findall(".//testsuite")
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)

          print({
              "tests": tests,
              "skipped": skipped,
              "failures": failures,
              "errors": errors,
          })

          sys.exit(1 if not tests or skipped or failures or errors else 0)
          PY
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewai-governance-benchmark
          path: |
            ${{ runner.temp }}/crewai-governance-benchmark
            benchmark-results.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Public boundary
        run: python scripts/check-public-boundary.py
      - name: Compatibility migrations
        run: python scripts/check_compatibility_migrations.py
      - name: Agentic-network reference CI demonstration
        run: python scripts/agentic_network_ci.py

  native-frameworks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with native frameworks
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "crewai==1.15.4" "langgraph==1.2.2"
      - name: Record framework versions and forbid skips
        run: |
          python -c "import crewai; print('crewai', crewai.__version__)"
          python -c "import importlib.metadata as m; print('langgraph', m.version('langgraph'))"
      - name: Native CrewAI and LangGraph integration tests
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          python -m pytest \
            tests/test_agentic_crewai_native.py \
            tests/test_agentic_integrations.py \
            tests/test_crewai_nornyx_comparison.py \
            -v -rs
      - name: CrewAI x Nornyx A/B comparison (run + machine-check artifacts)
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          CREWAI_TRACING_ENABLED: "false"
          CREWAI_TESTING: "true"
        run: |
          python examples/crewai_nornyx_comparison/compare.py \
            --no-benchmark --out "$RUNNER_TEMP/crewai-nornyx-comparison"
          python examples/crewai_nornyx_comparison/ci_check_artifacts.py \
            "$RUNNER_TEMP/crewai-nornyx-comparison"
      - name: Isolated published Nornyx 1.7.0 verification (installs from PyPI)
        run: |
          python examples/crewai_nornyx_comparison/verify_published_nornyx.py \
            --out "$RUNNER_TEMP/nornyx-published-verify"

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Run installed-wheel no-network smoke
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name 'nornyx-*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/test_wheel_install.py "$wheel"
