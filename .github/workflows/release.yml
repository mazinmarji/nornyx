name: release

# Publishes Nornyx to PyPI via Trusted Publishing (OIDC) — no API token stored
# anywhere. Publishing fires only when a GitHub Release is published AND its
# tag matches the core package's own `vX.Y.Z` convention exactly — this is a
# positive eligibility gate, not merely "not an adapter tag": any other tag
# shape (adapters-vX.Y.Z, a prerelease suffix, an unrelated tag) is excluded.
# The tag's X.Y.Z must also equal the `pyproject.toml` version at the exact
# commit the tag targets, as in adapters-release.yml: a well-formed tag on a
# commit that declares a different version publishes nothing. A release marked
# as a prerelease publishes nothing, and neither does a tag on a commit that
# main does not contain.
# Manual dispatch runs the test job without deploying to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the AUD-022 regression test resolves the audited
          # base commit in a candidate-diff range expression.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install what ci.yml installs for the full suite: the dev extra (pytest,
      # and mistune for tests/test_book_build.py) and the Graphviz `dot` binary
      # the book build needs. Without them the test job fails, and publish,
      # which needs it, never runs.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install ".[dev]"
      # python -m puts the checkout root on sys.path so the repository-root
      # `scripts` helper modules imported by the test suite are resolvable.
      - run: python -m pytest -q

  check-core-tag:
    # Only a 'release' event has a tag_name to evaluate; workflow_dispatch has
    # none, so it is correctly excluded from ever setting eligible=true.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Checkout the exact commit the release tag targets
        uses: actions/checkout@v4
        with:
          # Full history fetches every branch to refs/remotes/origin/*, so the
          # check below can confirm main contains the tagged commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag matches vX.Y.Z, binds to the package version, is not a prerelease and is on main
        id: check
        # The tag name and the prerelease flag reach the script as data, never
        # as script text: git allows quotes, `$`, `;` and `(` in tag names.
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="$TAG_NAME"
          eligible=false
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
            pkg_version="$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')"
            pkg_version="${pkg_version%$'\r'}"
            if [[ "$tag_version" != "$pkg_version" ]]; then
              echo "::error::release tag v${tag_version} does not match package version ${pkg_version} at this commit"
            elif [[ "$PRERELEASE" != "false" ]]; then
              # A vX.Y.Z upload is a final release on PyPI and cannot be
              # replaced, so a GitHub prerelease never publishes.
              echo "::error::release ${tag} is marked as a prerelease; prereleases never publish"
            elif ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::release tag ${tag} targets a commit that main does not contain"
            else
              eligible=true
            fi
          fi
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'release' && needs.check-core-tag.outputs.eligible == 'true'
    needs: [test, check-core-tag]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # Bind what is uploaded, not only what pyproject.toml declares: exactly
      # the sdist and wheel for the tag's version, nothing else.
      - name: Verify the built distributions carry the release tag's version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          test -f "dist/nornyx-${version}.tar.gz"
          test -f "dist/nornyx-${version}-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed: PyPI verifies the OIDC identity of this workflow.
        with:
          # PEP 740 attestations, declared rather than inherited. This is the
          # action's current default for Trusted Publishing flows, but the ref
          # above tracks a moving branch: stating it here makes provenance a
          # property of this workflow rather than of whichever default happens
          # to be in force at publish time. Removing this line is a change to
          # the release's verifiability, so tests/test_identity_claims_boundary.py
          # asserts it stays. See docs/PROVENANCE_AND_RELEASE_VERIFICATION.md.
          attestations: true
