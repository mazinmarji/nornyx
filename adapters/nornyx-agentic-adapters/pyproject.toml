[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nornyx-agentic-adapters"
version = "0.2.0"
description = "Framework adapters (CrewAI, LangGraph) for the Nornyx nornyx.agentic authorization SPI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mazin Marji and Nornyx Contributors"}]
keywords = ["nornyx", "agentic", "authorization", "governance", "crewai", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["nornyx>=1.10,<2"]

[project.optional-dependencies]
crewai = ["crewai==1.15.4"]
langgraph = ["langgraph==1.2.2"]
# Ruff is bounded to a single tested minor series (see [tool.ruff.lint] below):
# an unbounded lower pin let a fresh install resolve a newer Ruff whose changed
# default rule set failed CI non-reproducibly (ADR-0039 M2-B audit finding F1).
dev = ["pytest>=8.0", "ruff>=0.16.0,<0.17", "build", "twine"]

[project.urls]
Homepage = "https://github.com/mazinmarji/nornyx"
Repository = "https://github.com/mazinmarji/nornyx"
"ADR-0039" = "https://github.com/mazinmarji/nornyx/blob/main/docs/decisions/ADR-0039-agentic-integration-sdk.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nornyx_agentic_adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit lint contract for the adapter package. This pins the repository's
# established rule set (Ruff's historical E4/E7/E9/F default — pycodestyle
# error subset plus Pyflakes) rather than depending on Ruff's evolving built-in
# defaults, so `ruff check .` is reproducible across Ruff releases within the
# bounded dev pin above (ADR-0039 M2-B audit finding F1). `select` replaces the
# default rule set entirely; new default rules in future Ruff versions cannot
# silently change the result. No per-file ignores are used to force green CI.
select = ["E4", "E7", "E9", "F"]
